ering activities from prototype through production</li>\n <li>Assist      with product bring-up, functional testing, validation, and failure      analysis</li>\n <li>Execute      and maintain production and validation test procedures</li>\n <li>Support      manufacturing builds, yield improvement, and quality investigations</li>\n <li>Assist      in managing component changes and obsolescence under guidance from senior      engineers</li>\n <li>Prepare      and maintain technical documentation (test reports, assembly instructions,      application notes)</li>\n <li>Collaborate      cross-functionally with RF, Software, Mechanical, and Operations teams</li>\n</ul>\n<p><strong>What Success Looks Like</strong></p>\n<ul>\n <li>Reliable      support of product development from prototype to production</li>\n <li>Successful      execution of validation, testing, and manufacturing support activities</li>\n <li>Improved      manufacturing yield and reduced product defects</li>\n <li>Strong      cross-functional collaboration across engineering and operations teams</li>\n <li>Well-maintained      documentation and scalable test processes</li>\n</ul>\n<p><strong>Who You Are</strong></p>\n<ul>\n <li>Bachelor\u2019s      degree in Electronics, Communication Engineering, or a related field</li>\n <li>Min 2\u20135      years of experience in hardware, RF, or product engineering roles</li>\n <li>Basic      understanding of RF/Wi-Fi systems and electronic hardware debugging</li>\n <li>Familiarity      with manufacturing processes, testing, and quality control</li>\n <li>Strong      teamwork, communication skills, and willingness to learn</li>\n <li>Ability      to work effectively in a fast-paced, cross-functional environment</li>\n</ul>\n<p><strong>Preferred Qualifications (Optional)</strong></p>\n<ul>\n <li>Experience      in drones, robotics, wireless networking, or embedded systems</li>\n <li>Exposure      to manufacturing environments and production scaling</li>\n <li>Familiari
