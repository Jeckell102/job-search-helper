"en-US","jobPostingId":"7933"}],"queryHash":"[\"site-info\",{\"careerSiteXRefCode\":\"ESACAREERSITE\",\"clientNamespace\":\"esa\",\"jobPostingId\":\"7933\",\"language\":\"en-US\"}]"},{"state":{"data":{"jobPostingId":7933,"jobReqId":845,"jobTitle":"Program Manager III, Program Management Excellence (PMX)","postingStartTimestampUTC":"2026-09-10T04:00:00+00:00","postingExpiryTimestampUTC":null,"isEvergreen":false,"isInternal":false,"relocationEligible":null,"reapplyPeriodDays":null,"createdTimestampUTC":"2026-09-18T13:52:49.81+00:00","lastModifiedTimestampUTC":"2026-09-18T13:52:49.81+00:00","isoCurrencyRegion":null,"jobPostingContent":{"jobDescriptionHeader":"\u003cdiv style=\"text-align: justify;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u003cspan style=\"white-space-collapse: collapse; text-align: justify; font-family: Arial, sans-serif;\"\u003eCompany Information:\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u003cspan style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" data-teams=\"true\"\u003eTwenty-Six Defense, headquartered in Fort Worth, Texas, is a leading provider of high-performance products, system solutions, and aftermarket support services focusing on the defense, homeland security, and commercial aviation markets. With facilities throughout the U.S., Twenty-Six Defense is dedicated to supporting those who contribute to the national security of the United States. Twenty-Six Defense is wholly owned by Elbit Systems Ltd. (NASDAQ: ESLT and TASE: ESLT), a global high-technology company engaged in a wide range of programs for innovative defense and commercial applications.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e","jobDescription":"\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eJob Summary:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; text-align: justify; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eThe Program Manager, Program Management Excellence (PMX), reporting to the Director, Program Start Up Excellence, will support the mission of the PMX and will be responsible for providing hands-on project support services during the bid and proposal and planning phases to Project/Program Managers across the organization. The person in this role will provide expertise in the tools and processes required to build solid proposals and project execution plans, establish thorough and robust Program Management Plans, Performance Measurement Baselines (PMB), Risk Management plans, and Risk Identification and Mitigation Plans, working under the direction of the Director of Program Start Up Excellence. In addition, this role shall provide on-demand training to project teams on various enterprise tools and management processes. In addition, this position also requires the ability to work on multiple projects at once and requires maintaining flexibility to work with the PMX team and Project/Program Managers to ensure the solid, robust proposal and planning phase support is provided to Twenty-Six Defense PMs.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eResponsibilities and Tasks:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eResponsible for guiding teams through the proposal process for program start-up excellence.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eEVMS implementation through consistent EVM processes and enterprise-level training.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eConduct Risk Identification workshops and support Risk Management process implementation.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eSupport Program Managers with understanding how to analyze financial data, including project budgets, risks, and resource allocation.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAudit projects to ensure that team members are executing in accordance with documented management plans and in accordance with company standards. Assist in developing and implementing corrective action plans.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eIdentify and document best practices with opportunities for improvement in Twenty Six Defense\u0026rsquo;s program management processes.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eShare lessons learned and best practices across programs, building relationships with stakeholders and brokering relationships at all levels.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eEnsure implementation of workable, practical, and sustainable best practices and processes that enhance productivity.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eA wide degree of creativity and latitude is expected\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eRelies on extensive experience and judgment to plan and accomplish goals\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eProvide coaching to Twenty-Six Defense Program Managers\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eCollaborate with internal Twenty-Six Defense organizations to identify common solutions\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eExecute approved plans\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eTwenty-Six Defense Program Managers and staff\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eEducation, Experience \u0026amp; License or Certification:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eMaster - Preferred\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eBachelor - Required\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eHigh School - Required\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eSpecific Degree Field, preferred: Engineering, Manufacturing, or equivalent Technical degree\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eProject Management Professional (PMP)\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eLean 6 Sigma Green Belt\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eFunctional (Using Skill Set) - 10+\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eProgram Management - 8+\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eIndustry - 15+\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eSkills and Abilities:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eDemonstrated experience managing programs over some of the various phases of the product life cycle (pursuit through support and closure).\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eCapable of managing cross-functional teams (manufacturing, supply chain, engineering, etc.). Demonstrated experience working in these functions or successfully leading a cross-functional team.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eCapable of creating and maintaining constructive customer relationships.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eUnderstanding of industry trends and our customers and competitors\u0026rsquo; strategies, strengths, and weaknesses.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eStrong experience in the applicable technical area or product line.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to complete programs within scope, on time, within budget, and deliver a quality product to the customer with a high level of satisfaction.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eWorking knowledge of the defense acquisition process and an understanding of Defense Acquisition Regulations (DFARS).\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to manage disciplined internal processes by knowledge of industry standard tools and holding others accountable for the following: Earned value management, Program Planning, Risk Management, Requirements Management\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eWorking knowledge and understanding of financial data such as P\u0026amp;L statements, ROI analysis, and cash flow. High degree of business acumen.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eStrong knowledge of Integrated Logistics Support.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eExposure and working knowledge in negotiation, collaborative problem solving, conflict management, meeting facilitation skills, and applying tact and diplomacy with internal/external customers and foreign personnel.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eUnderstanding of program documentation, requirements, expectations, and deliverables, i.e., the RFP, proposal, contract, SOW, assumptions, constraints, CDRLs, etc.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to clearly communicate ideas verbally and in writing.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to influence without authority.\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; font-family: 'Century Gothic'; font-size: 12.0pt; color: black;\"\u003e\u003cspan style=\"color: #ffffff;\"\u003e#LI-TS1\u003c/span\u003e\u003c/p\u003e","jobDescriptionFooter":"\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: Arial, sans-serif;\"\u003eHere Are Some of the Great Benefits We Offer:\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\" type=\"disc\"\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eMost locations offer a 9/80 schedule, providing every other Friday off \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eCompetitive compensation \u0026amp; 401(k) program to plan for your future \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eRobust medical, dental, vision, \u0026amp; disability coverage with qualified wellness discounts \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eBasic Life Insurance and Additional Life \u0026amp; AD\u0026amp;D Insurances are available \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eFlexible Vacation \u0026amp; PTO \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003ePaid Parental Leave \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eGenerous Employee Referral Program \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eVoluntary Benefits Available: Longer Term Care, Legal, Identity Theft, Pet Insurance, and more \u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin-top: 0in; margin-right: 0in; margin-bottom: 0in; font-size: 12pt; font-family: Aptos, sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-family: Arial, sans-serif; font-size: 12pt; color: #000000;\"\u003eVoluntary Tricare Supplement available for military retirees \u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif; text-align: justify;\"\u003e\u003cspan style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"\u003e\u003cem\u003e\u003cspan style=\"color: #000000;\"\u003eThis job description does not list all the duties of the job. You may be asked by your supervisors or managers to perform other duties. The employer has the right to revise this job description at any time. The job description is not an employment contract. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions of this position. Twenty-Six Defense\u003c/span\u003e\u003cspan style=\"color: #000000;\"\u003e\u0026nbsp;is an equal opportunity employer as to all protected groups, including protected veterans and individuals with disabilities.\u003c/span\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif; text-align: justify;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif; text-align: justify;\"\u003e\u003cspan style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"\u003e\u003cem\u003e\u003cstrong\u003e*For Virginia-based positions only* \u003c/strong\u003eIn accordance with Virginia DOL requirements, the listed salary range reflects the anticipated base pay range for this role. Actual compensation will be determined based on factors including skills, experience, education, certifications, business needs, internal equity, and geographic location. Compensation may vary in different locations based on market conditions and cost-of-labor considerations.\u003c/e 003cspan style=\"font-size: 12pt;\"\u003e\u003cspan style=\"white-space-collapse: collapse; text-align: justify; font-family: Arial, sans-serif;\"\u003eCompany Information:\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u003cspan style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" data-teams=\"true\"\u003eTwenty-Six Defense, headquartered in Fort Worth, Texas, is a leading provider of high-performance products, system solutions, and aftermarket support services focusing on the defense, homeland security, and commercial aviation markets. With facilities throughout the U.S., Twenty-Six Defense is dedicated to supporting those who contribute to the national security of the United States. Twenty-Six Defense is wholly owned by Elbit Systems Ltd. (NASDAQ: ESLT and TASE: ESLT), a global high-technology company engaged in a wide range of programs for innovative defense and commercial applications.\u003c/span\u003e\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e\n\u003cdiv style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/div\u003e","jobDescription":"\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eJob Summary:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; text-align: justify; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eThe Program Manager, Program Management Excellence (PMX), reporting to the Director, Program Start Up Excellence, will support the mission of the PMX and will be responsible for providing hands-on project support services during the bid and proposal and planning phases to Project/Program Managers across the organization. The person in this role will provide expertise in the tools and processes required to build solid proposals and project execution plans, establish thorough and robust Program Management Plans, Performance Measurement Baselines (PMB), Risk Management plans, and Risk Identification and Mitigation Plans, working under the direction of the Director of Program Start Up Excellence. In addition, this role shall provide on-demand training to project teams on various enterprise tools and management processes. In addition, this position also requires the ability to work on multiple projects at once and requires maintaining flexibility to work with the PMX team and Project/Program Managers to ensure the solid, robust proposal and planning phase support is provided to Twenty-Six Defense PMs.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eResponsibilities and Tasks:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eResponsible for guiding teams through the proposal process for program start-up excellence.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eEVMS implementation through consistent EVM processes and enterprise-level training.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eConduct Risk Identification workshops and support Risk Management process implementation.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eSupport Program Managers with understanding how to analyze financial data, including project budgets, risks, and resource allocation.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAudit projects to ensure that team members are executing in accordance with documented management plans and in accordance with company standards. Assist in developing and implementing corrective action plans.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eIdentify and document best practices with opportunities for improvement in Twenty Six Defense\u0026rsquo;s program management processes.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eShare lessons learned and best practices across programs, building relationships with stakeholders and brokering relationships at all levels.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eEnsure implementation of workable, practical, and sustainable best practices and processes that enhance productivity.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eA wide degree of creativity and latitude is expected\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eRelies on extensive experience and judgment to plan and accomplish goals\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eProvide coaching to Twenty-Six Defense Program Managers\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eCollaborate with internal Twenty-Six Defense organizations to identify common solutions\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eExecute approved plans\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eTwenty-Six Defense Program Managers and staff\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eEducation, Experience \u0026amp; License or Certification:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eMaster - Preferred\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eBachelor - Required\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eHigh School - Required\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eSpecific Degree Field, preferred: Engineering, Manufacturing, or equivalent Technical degree\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eProject Management Professional (PMP)\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eLean 6 Sigma Green Belt\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eFunctional (Using Skill Set) - 10+\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eProgram Management - 8+\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eIndustry - 15+\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eSkills and Abilities:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eDemonstrated experience managing programs over some of the various phases of the product life cycle (pursuit through support and closure).\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eCapable of managing cross-functional teams (manufacturing, supply chain, engineering, etc.). Demonstrated experience working in these functions or successfully leading a cross-functional team.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eCapable of creating and maintaining constructive customer relationships.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eUnderstanding of industry trends and our customers and competitors\u0026rsquo; strategies, strengths, and weaknesses.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eStrong experience in the applicable technical area or product line.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to complete programs within scope, on time, within budget, and deliver a quality product to the customer with a high level of satisfaction.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eWorking knowledge of the defense acquisition process and an understanding of Defense Acquisition Regulations (DFARS).\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to manage disciplined internal processes by knowledge of industry standard tools and holding others accountable for the following: Earned value management, Program Planning, Risk Management, Requirements Management\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eWorking knowledge and understanding of financial data such as P\u0026amp;L statements, ROI analysis, and cash flow. High degree of business acumen.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eStrong knowledge of Integrated Logistics Support.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eExposure and working knowledge in negotiation, collaborative problem solving, conflict management, meeting facilitation skills, and applying tact and diplomacy with internal/external customers and foreign personnel.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eUnderstanding of program documentation, requirements, expectations, and deliverables, i.e., the RFP, proposal, contract, SOW, assumptions, constraints, CDRLs, etc.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to clearly communicate ideas verbally and in writing.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 150%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 150%; font-family: Arial, sans-serif;\"\u003eAbility to influence without authority.\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0in; font-family: 'Century Gothic'; font-size: 12.0pt; color: black;\"\u003e\u003cspan style=\"color: #ffffff;\"\u003e#LI-TS1\u003c/span\u003e\u003c/p\u003e","jobDescriptionFooter":"\u003cp style=\"margin: 0in; font-size: 12pt; font-family: Aptos, sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; color: #000000;\"\u003e\u003cstrong\u003e\u003c
