ription-amcv":"This is a pattern type cookie associated with Adobe Marketing Cloud. It stores a unique visitor identifier and uses an organization identifier to allow a company to track users across their domains and services.","cookie-description-amcvs":"This is a pattern type cookie associated with Adobe Marketing Cloud. It stores a unique visitor identifier and uses an organization identifier.","cookie-description-bcookie":"This is a browser identifier cookie used to uniquely identify devices accessing LinkedIn to detect abuse on the platform.","cookie-description-bscookie":"This cookie is used for saving the state of 2FA of a logged in user.","cookie-description-cookie-preferences":"This cookie is used to hold the cookies preferences set by the user","cookie-description-cp":"This cookie is used to store the execution context of a registered user on the website.","cookie-description-debug-enabled":"Written and read in when the function pendo.isDebuggingEnabled() is triggered, which gets information from this cookie, is used in several places (like log.js, guides.js, and exports.js)","cookie-description-fbp":"This cookie is used by Facebook to deliver a series of advertisement products such as real time bidding from third-party advertisers.","cookie-description-ga":"This cookie name is associated with Google Universal Analytics, which is a significant update to Google's more commonly used analytics service. This cookie is used to distinguish unique users by assigning a randomly generated number as a client identifier. It is included in each page request on a website and is used to calculate visitor, session, and campaign data for the website's analytics reports. By default, the cookie is set to expire after two years, however, this is customizable by website owners.","cookie-description-gat":"This cookie name is associated with Google Universal Analytics, which is a significant update to Google's more commonly used analytics service. It is used to throttle the request rate, limiting the collection of data on high traffic websites.","cookie-description-gat-tealium-0":"This cookie is used by Google Analytics.","cookie-description-gid":"This cookie name is associated with Google Universal Analytics, which is a significant update to Google's more commonly used analytics service. It appears to be a new cookie and as of Spring 2017 no information is available from Google. It appears to store and update a unique value for each page that is visited.","cookie-description-help-system-transfer":"This cookie is used to transfer encrypted session data to the HelpSystem.","cookie-description-hj-absolute-session-in-progress":"This cookie is associated with the analytics service provided by Hotjar. It is used to detect the first pageview session of a user. This is a True/False flag set by the cookie.","cookie-description-hj-first-seen":"This cookie is associated with the analytics service provided by Hotjar. It is used to identify the first session for new users on a website.","cookie-description-hj-tld-test":"This cookie is associated with the analytics service provided by Hotjar. When the Hotjar script executes we try to determine the most generic cookie path we should use, instead of the page hostname. This is done so that cookies can be shared across subdomains (where applicable). To determine this, we try to store the _hjTLDTest cookie for different URL substring alternatives until it fails. After this check, the cookie is removed.","cookie-description-hjid":"This cookie is associated with the analytics service provided by Hotjar and is set when you first land on a page with the Hotjar script. It is used to persist the random user ID, unique to that website on the browser. This ensures that behavior in subsequent visits to the same website will be attributed to the same user ID.","cookie-description-incap-ses":"This cookie is used for linking HTTP requests to certain sessions (aka visits). Re-opening the browser and accessing the same site is registered as a different sessions. However, this cookie allows you to maintain existing sessions (i.e. session cookies).","cookie-description-job-seeker-session-id":"This cookie is used by Seek to assign a session Id.","cookie-description-job-seeker-visitor-id":"This cookie is used by Seek to assign a visitor Id.","cookie-description-jsessionid":"This cookie is used for Cross-Site Request Forgery protection.","cookie-description-lang":"This cookie is used to remember a user's language setting.","cookie-description-lidc":"This cookie is used to to optimize data center selection.","cookie-description-lissc":"This cookie is used to ensure that there is the correct SameSite attribute for all cookies in that browser.","cookie-description-log-enabled":"The agent uses this cookie to record additional details for troubleshooting purposes.","cookie-description-login":"This cookie is used by Seek","cookie-description-namespace-cookie":"This  cookie is used to hold information about the namespace of the client.","cookie-description-pendo-account-id":"The agent uses this cookie to identify and record the visitor’s Account ID that will be used in Pendo like Guide delivery and analytics.","cookie-description-pendo-feedback-ping-sent":"The agent will write information about the user (or visitor) like name, value, etc. when a ping is successful. Written when we send a ping for a user, there is then a 5 minute timer which checks to see if the cookie has expired, if it has we send another ping. A feedback ping includes information about the user, their name, value etc.","cookie-description-pendo-feedback-ping-sent-none":"The response of a ping includes a notification count. Pendo writes this to a cookie so that it is persisted across refreshes, It’s deleted when the user opens feedback.","cookie-description-pendo-final-dismissed-auto-at":"Written and read in the agent. This cookie, along with \"lastStepAdvanced\" and \"latestDismissedAutoAt,\" are short-term cookies (~10 seconds) that keep guides from showing again after they've been dismissed.","cookie-description-pendo-last-step-advanced":"Written and read in the agent. This cookie, along with \"latestDismissedAutoAt\" and \"finalDismissedAutoAt,\" are short-term cookies (~10 seconds) that keep guides from showing again after they've been dismissed.","cookie-description-pendo-latest-dismissed-auto-at":"Written and read in the agent. This cookie, along with \"lastStepAdvanced\" and \"finalDismissedAutoAt,\" are short-term cookies (~10 seconds) that keep guides from showing again after they've been dismissed.","cookie-description-pendo-launcher-closed":"The agent uses this cookie to identify and record the visitor information. Then, the information is used in Pendo analytics and Guide delivery.","cookie-description-pendo-meta":"Written and read in the agent. This cookie stores a hash of the current metadata so that Pendo can see when it's changed and update it.","cookie-description-pendo-receptive-ping-sent":"Same as above. Renamed to match the Pendo naming when Feedback was acquired (previously known as Receptive).","cookie-description-pendo-visitor-id":"The agent uses this cookie to identify and record the visitor information so the information is used in Pendo analytics and Guide delivery.","cookie-description-pin-unauth":"This cookie is assocate with Pinterest. It is used to track the usage of services.","cookie-description-response-trial":"This cookie is used by Seek","cookie-description-responsive-trial":"This cookie is used by Seek","cookie-description-s-cc":"This cookie is associated with the analytics service provided by Adobe's Site Catalyst product suite. It is used to determine whether cookies are enabled in the browser.","cookie-description-s-ecid":"This cookie name is associated with the Adobe Audience Manager ID (DMP). It sets a unique ID for the visitor, which allows third-party advertisers to target the visitor with relevant advertisements. This pairing service is provided by third-party advertisement hubs, which allows for real-time bidding for advertisers.","cookie-description-s-fid":"This cookie name is associated with the analytics service provided by Adobe's Site Catalyst product suite. It is a new cookie introduced in 2013 as a 'fallback' visitor identifier where the s_vi cookie normally used for this purpose is blocked. It contains a randomly generated, unique id.","cookie-description-s-invisit":"This cookie is associated with the analytics service provided by Adobe's Site Catalyst product suite. It is used to count the visits made by a user to the website.","cookie-description-s-lastvisit":"This cookie name is associated with Adobe Analytics, which provides anonymous statistical information for us. IP addresses and information from other cookies is processed and used on our website to count page views, how many visitors we have, what browsers they are using (so we can target our resources in the right way to maximize compatibility for the majority of our users), and, in some cases, in which country, city, or region they are located.","cookie-description-s-nr":"This cookie name is associated with the analytics service provided by Adobe's Site Catalyst product suite. It is used to store the date that a website was visited as well as whether the visitor is new or returning.","cookie-description-s-sq":"This cookie is associated with the analytics service provided by Adobe's Site Catalyst product suite. It is used to store information about the previous link clicked within the website.","cookie-description-s-vnum":"This cookie is associated with the analytics service provided by Adobe's Site Catalyst product suite. It is used to track the number of visits by a unique visitor.","cookie-description-scid":"This cookie is associated with Snapchat. Is sets a unique ID for the visitor, which allows third-party advertisers to target the visitor with relevant advertisement. This pairing service is provided by third-party advertisement hubs, which facilitates real-time bidding for advertisers.","cookie-description-sctr":"This cookie is used to determine whether a third-party tag will be called in Snap Ads Pixel.","cookie-description-sj":"This cookie is used by Seek","cookie-description-third-party-pixel-tracking":"Allows the customer to measure candidate conversion activity when you start or finish an application. Privacy policy url: \u003clnk\u003e{{privacyPolicyUrl}}\u003c/lnk\u003e","cookie-description-updated-last-login":"This cookie is used by Seek","cookie-description-utag-main":"This cookie name is associated with the Tealium data platform. It is used for web analytics.","cookie-description-visid-incap":"This cookie is used for linking certain sessions (aka visits) to a specific visitor (i.e., a specific computer). This cookie identifies clients who have already visited the website.","cookie-preferences-description":"You can also change your cookie preferences at any time by clicking on “Cookie Preferences” located in the footer of our website. For more information, refer to ","cookie-preferences-title":"Cookie Preferences","cookie-prefs":"Cookie Preferences","cookie-prefs-blocked-cookies-description":"Your browser settings are currently set to block cookies. Our website cannot function properly without these essential cookies. This includes allowing you to stay signed into your account and apply to jobs. \u003cbr/\u003e \u003cbr/\u003e Please allow cookies in your web browser to optimally use this site.","cookie-prefs-description":"We use technology, such as cookies, to improve site functionality, personalize content, and analyze web traffic. By clicking \"Accept\" you also allow optional advertising, analytics, and candidate conversion tracking. You can learn more about online tracking in our \u003clnk\u003eCookie Statement\u003c/lnk\u003e","cookie-settings":"Cookie Settings","cookie-statement":"Cookie Preference Center","cookie-statement-bullet-point1":"Measure and track your activities, such as when you navigate around our Website;","cookie-statement-bullet-point2":"Count and recognize visitors to our Website to see which pages received the most views;","cookie-statement-bullet-point3":"Personalize your experience on our Website;","cookie-statement-bullet-point4":"Enable us to remember your viewing preferences and assist during registrations and log-ins;","cookie-statement-bullet-point5":"Allow us to track your status or progress when requesting products, services, or other information;","cookie-statement-bullet-point6":"Collect performance analytics on our Website;","cookie-statement-bullet-point7":"To record search terms you enter on our Website, the link you clicked to bring you to the webpage, your IP address, or cookies that are set on your browser through web server logs.","cookie-statement-bullet-title":"We use cookies for the following purposes:","cookie-statement-description-first":"Dayforce uses cookies on our website and app (collectively referred to as “Website”). A cookie is a file containing an identifier (a string of letters and numbers) that is sent by a web server to a web browser and is stored by the browser. The identifier is then sent back to the server each time the browser requests a page from the server. Cookies allow Websites to recognize your device next time you visit, track your browsing history, personal preferences, and interests, and improve and customize your browsing experience.","cookie-statement-description-second":"Cookies may be either “persistent” cookies or “session” cookies. A persistent cookie will be stored by a web browser and will remain valid until its set expiry date unless deleted by the user before the expiry date. A session cookie, on the other hand, will expire at the end of the user session when the web browser is closed.","cookie-statement-hypelink":"Dayforce Cookie Statement","cookie-statement-link":"You can learn more about online tracking in our \u003clnk\u003eCookie Statement\u003c/lnk\u003e. bled() 被触发时，在多个地方(如 log.js、guides.js 和 exports.js)进行读取和写入","cookie-description-fbp":"Facebook 会使用该 Cookie 来投放一系列广告产品，如第三方广告商的实时出价。","cookie-description-ga":"该 Cookie 名称与 Google Universal Analytics 相关联，这是对 Google 更常用的分析服务的重大更新。该 Cookie 会分配随机生成的数字作为客户端标识符，以此来区分具有唯一身份的用户。网站的每个页面请求中均包含该 Cookie，此类 Cookie 可用于计算网站分析报告的访客、会话和活动数据。默认情况下，系统会将 Cookie 设置为两年后过期，但网站所有者可以对其进行自定义。","cookie-description-gat":"该 Cookie 名称与 Google Universal Analytics 相关联，这是对 Google 更常用的分析服务的重大更新。此类 Cookie 可用于控制请求速率，限制高流量网站的数据收集。","cookie-description-gat-tealium-0":"该 Cookie 由 Google Analytics 使用。","cookie-description-gid":"该 Cookie 名称与 Google Universal Analytics 相关联，这是对 Google 更常用的分析服务的重大更新。这似乎是新型 Cookie，截至 2017 年春季，Google 尚未提供任何信息。其似乎可用于为访问的每个页面存储和更新唯一值。","cookie-description-help-system-transfer":"该 Cookie 用于将加密的会话数据传输到帮助系统。","cookie-description-hj-absolute-session-in-progress":"该 Cookie 与 Hotjar 提供的分析服务相关联，可用于检测用户的第一个浏览量会话。这是由 Cookie 设置的 True/False 标记。","cookie-description-hj-first-seen":"该 Cookie 与 Hotjar 提供的分析服务相关联，可用于识别网站新用户的首次会话。","cookie-description-hj-tld-test":"该 Cookie 与 Hotjar 提供的分析服务相关联，当执行 Hotjar 脚本时，我们会尝试确定我们应该使用的最通用 Cookie 路径，而不是页面主机名。这样做的目的是在不同子域之间共享 Cookie(在适用的情况下)。为了确定这一点，我们会尝试为不同的 URL 子字符串备选项存储 _hjTLDTest Cookie，直至此过程进行不下去为止。系统会在经过检查之后删除该 Cookie。","cookie-description-hjid":"该 Cookie 与 Hotjar 提供的分析服务相关联，您需在首次使用 Hotjar 脚本登录页面时进行设置。该 Cookie 用于保存随机用户 ID，该 ID 在浏览器上为该网站所特有。这可确保系统将以后访问同一网站时的行为归于同一用户 ID。","cookie-description-incap-ses":"该 Cookie 用于将 HTTP 请求链接到特定的会话(也称为访问)。重新打开浏览器并访问同一站点会被登记为不同的会话。但是，该 Cookie 允许您维护现有的会话(即会话 Cookie)。","cookie-description-job-seeker-session-id":"Seek 使用该 Cookie 来分配会话 ID。","cookie-description-job-seeker-visitor-id":"Seek 使用该 Cookie 来分配访客 ID。","cookie-description-jsessionid":"该 Cookie 用于保护跨站点请求伪造。","cookie-description-lang":"该 Cookie 用于记住用户的语言设置。","cookie-description-lidc":"该 Cookie 用于优化数据中心选择。","cookie-description-lissc":"该 Cookie 用于确保此浏览器中的所有 Cookie 均具有正确的 SameSite 属性。","cookie-description-log-enabled":"代理使用此 Cookie 记录故障排除所需的其他详细信息。","cookie-description-login": 态或进度；","cookie-statement-bullet-point6":"收集我们网站上的性能分析；","cookie-statement-bullet-point7":"记录您在我们网站上输入的搜索字词、将您引导至我们网页的链接、您的 IP 地址或通过 Web 服务器日志在您的浏览器上设置的 Cookie。","cookie-statement-bullet-title":"我们使用 Cookie 的目的如下:","cookie-statement-description-first":"Dayforce 会在我们的网站和应用(统称为“网站”)上使用 Cookie。Cookie 是一种包含标识符(由字母和数字组成的字符串)的文件，由 Web 服务器发送到 Web 浏览器并由浏览器存储。在此之后，每次浏览器从服务器请求页面时，标识符都会被发送回服务器。Cookie 可让网站在您下次访问时识别您的设备，跟踪您的浏览历史记录、个人偏好和兴趣，以及改善和自定义您的浏览体验。","cookie-statement-description-second":"Cookie 可以是“永久性”Cookie 或“会话性”Cookie。永久性 Cookie 将由 Web 浏览器储存。除非用户在到期日前删除，否则 Cookie 在其设置的到期日期前始终有效。另一方面，当 Web 浏览器关闭后，会话性 Cookie 会在用户会话结束时到期。","cookie-statement-hypelink":"Dayforce Cookie 声明","cookie-statement-link":"您可以在我们的 \u003clnk\u003eCookie 报表\u003c/lnk\u003e中了解有关在线追踪的更多信息。","cookie-statement-updated-on":"更新于 2024 年 1 月 31 日","cookies-blocked-error-on-save":"您的浏览器设置当前被设置为阻止 Cookie。","cookies-categories-list-title":"以下是我们网站上已确定的 Cookie 类别列表:","cookies-saved-successful":"Cookie 偏好已保存。","customer-privacy-policy-description":"请查看客户的候选者追踪隐私政策，网址为: \u003clnk\u003e{{privacyPolicyUrl}}\u003c/lnk\u003e。","functional-cookies":"功能性 Cookie","functional-cookies-description":"这些 Cookie 可让网站提供经改进的功能和个性化服务。这些 Cookie 可能由我们或我们在网页中添加其服务的第三方提供商设置。如果您禁止网站使用 Cookie，部分或全部服务可能无法正常运行。","hide-cookie-details":"隐藏 Cookie 详细信息","how-to-control-cookies":"管理 Cookie","how-to-control-cookies-description":"您可以按照浏览器中的提示，将浏览器设置为拒绝使用 Cookie，或手动删除计算机上的单个或所有 Cookie。但是，如果您的浏览器设置为拒绝使用 Cookie，或者您手动删除了 Cookie，那么您在访问和使用当前位于或将来要添加到我们网站上的网页和功能时可能会遇到问题。","opt-out-for-sharing-description":"根据某些隐私法规，通过 Cookie 和其他跟踪器向第三方披露设备信息和互联网活动以发布有针对性的广告，此行为可能被视为“共享”行为。您可以通过访问“关闭目标性 Cookie”，选择退出所有可能导致“共享”个人信息以发布有针对性的广告的 Cookie。","opt-out-for-sharing-title":"选择退出“共享以发布有针对性的广告”","performance-cookies":"性能 Cookie","performance-cookies-description":"Cookie 使我们能够统计访问量和客流量来源，以便我们能够衡量和改善我们网站的性能。这些 Cookie 有助于我们了解最受欢迎及最不受欢迎的具体网页，并查看访客浏览网站的方式。通过这些 Cookie 收集的信息将被汇总。如果您禁止网站使用 Cookie，我们将无法知道您何时访问我们的网站，也无法监控其性能。","show-cookie-details":"显示 Cookie 详细信息","smartling": nt}} años","yes":"Sí"},"cookies":{"cookie-description-active-contexts":"Se lee y escribe en el agente en función de lo que se registra o no en la consola.","cookie-description-adrum":"Esta es una cookie de terceros que se ejecuta en la aplicación","cookie-description-amcv":"Esta es una cookie de tipo patrón asociada con Adobe Marketing Cloud. Almacena un identificador único de visitante y usa un identificador de organización para permitir que una empresa haga un seguimiento de los usuarios en sus dominios y servicios.","cookie-description-amcvs":"Esta es una cookie de tipo patrón asociada con Adobe Marketing Cloud. Almacena un identificador único de visitante y usa un identificador de organización.","cookie-description-bcookie":"Esta es una cookie de identificador del explorador que se usa para identificar unívocamente los dispositivos que acceden a LinkedIn con el fin de detectar abuso en la plataforma.","cookie-description-bscookie":"Esta cookie se utiliza para guardar el estado de la autenticación de dos factores (2FA) de un usuario que inició sesión.","cookie-description-cookie-preferences":"Esta cookie se utiliza para conservar las preferencias de cookies que estableció el usuario.","cookie-description-cp":"Esta cookie se utiliza para almacenar el contexto de ejecución de un usuario registrado en el sitio web.","cookie-description-debug-enabled":"Se lee y escribe cuando se activa la función pendo.isDebuggingEnabled(), que obtiene información de esta cookie, se utiliza en varios lugares (como log.js, guides.js y exports.js).","cookie-description-fbp":"Facebook utiliza esta cookie para enviar una serie de productos publicitarios (como ofertas en tiempo real) de anunciantes externos.","cookie-description-ga":"El nombre de esta cookie está asociado a Google Universal Analytics, que es una actualización importante del servicio de análisis de Google utilizado con mayor frecuencia. Esta cookie se usa para distinguir usuarios únicos mediante la asignación de un número generado de forma aleatoria a modo de identificador de cliente. Se incluye en cada solicitud de página de un sitio web y se usa para calcular los datos de visitantes, sesiones y campañas con fines de informes analíticos de dicho sitio web. De manera predeterminada, esta cookie se configura para que caduque después de dos años, pero los propietarios del sitio web pueden personalizar esta configuración.","cookie-description-gat":"El nombre de esta cookie está asociado a Google Universal Analytics, que es una actualización importante del servicio de análisis de Google utilizado con mayor frecuencia. Se usa para regular la frecuencia de las solicitudes, lo que limita la recopilación de datos en sitios web de tráfico intenso.","cookie-description-gat-tealium-0":"Google Analytics utiliza esta cookie.","cookie-description-gid":"El nombre de esta cookie está asociado a Google Universal Analytics, que es una actualización importante del servicio de análisis de Google utilizado con mayor frecuencia. Parece ser una nueva cookie, pero desde el segundo trimestre de 2017 no hay información disponible de Google al respecto. Al parecer, almacena y actualiza un valor único para cada página que se visita.","cookie-description-help-system-transfer":"Esta cookie se utiliza para transferir datos cifrados de la sesión a HelpSystem.","cookie-description-hj-absolute-session-in-progress":"Esta cookie está asociada al servicio de análisis que proporciona Hotjar. Se usa para detectar la primera sesión de vista de página de un usuario. Se trata de una marca de verdadero o falso establecida por la cookie.","cookie-description-hj-first-seen":"Esta cookie está asociada al servicio de análisis que proporciona Hotjar. Se usa para identificar la primera sesión de los nuevos usuarios de un sitio web.","cookie-description-hj-tld-test":"Esta cookie está asociada al servicio de análisis que proporciona Hotjar. Cuando se ejecuta el script de Hotjar, intentamos determinar la ruta de cookie más genérica que debemos usar, en lugar del nombre de host de la página. Esto es así para que las cookies puedan compartirse entre subdominios (según corresponda). Para determinar dicha ruta, intentamos almacenar la cookie _hjTLDTest para diferentes alternativas de subcadena de URL hasta que se produzca un error. Tras esta comprobación, se elimina la cookie.","cookie-description-hjid":"Esta cookie está asociada al servicio de análisis que proporciona Hotjar y se establece cuando el usuario llega a una página con el script de Hotjar. Se usa para preservar el identificador de usuario aleatorio, que es exclusivo de ese sitio web en el explorador. De este modo, se garantiza que el comportamiento en las visitas posteriores al mismo sitio web se atribuyan al mismo identificador de usuario.","cookie-description-incap-ses":"Esta cookie se utiliza para vincular solicitudes HTTP a ciertas sesiones (también conocidas como “visitas”). Volver a abrir el explorador y acceder al mismo sitio se registra como otra sesión. Sin embargo, esta cookie le permite mantener las sesiones existentes (es decir, cookies de sesión).","cookie-description-job-seeker-session-id":"Seek utiliza esta cookie para asignar un identificador de sesión.","cookie-description-job-seeker-visitor-id":"Seek utiliza esta cookie para asignar un identificador de visitante.","cookie-description-jsessionid":"Esta cookie se utiliza para la protección contra la falsificación de solicitudes entre sitios.","cookie-description-lang":"Esta cookie se utiliza para recordar la configuración de idioma de un usuario.","cookie-description-lidc":"Esta cookie se utiliza para optimizar la selección del centro de datos.","cookie-description-lissc":"Esta cookie se utiliza para garantizar que exista el atributo SameSite correcto para todas las cookies en ese explorador.","cookie-description-log-enabled":"El agente utiliza esta cookie para registrar detalles adicionales con propósitos de solución de problemas.","cookie-description-login":"Seek utiliza esta cookie","cookie-description-namespace-cookie":"Esta cookie se utiliza para conservar información sobre el espacio de nombres del cliente.","cookie-description-pendo-account-id":"El agente utiliza esta cookie para identificar y registrar el identificador de la cuenta del visitante que se utilizará en Pendo, como el análisis y la entrega de guías.","cookie-description-pendo-feedback-ping-sent":"El agente escribirá información sobre el usuario (o visitante), como el nombre, valor, etc., cuando un ping se complete correctamente. Se escribe cuando enviamos un ping a un usuario, luego hay un temporizador de 5 minutos que comprueba si la cookie caducó; si es así, enviamos otro ping. Un ping de comentarios incluye información sobre el usuario, su nombre, valor, etc.","cookie-description-pendo-feedback-ping-sent-none":"La respuesta de un ping incluye un recuento de notificaciones. Pendo lo escribe en una cookie para que persista durante las actualizaciones. Se elimina cuando el usuario abre los comentarios.","cookie-description-pendo-final-dismissed-auto-at":"Se escribe y lee en el agente. Esta cookie, junto con lastStepAdvanced y latestDismissedAutoAt, son cookies a corto plazo (~10 segundos) que impiden que las guías aparezcan de nuevo después de haberlas descartado.","cookie-description-pendo-last-step-advanced":"Se escribe y lee en el agente. Esta cookie, junto con latestDismissedAutoAt y finalDismissedAutoAt, son cookies a corto plazo (~10 segundos) que impiden que las guías aparezcan de nuevo después de haberlas descartado.","cookie-description-pendo-latest-dismissed-auto-at":"Se escribe y lee en el agente. Esta cookie, junto con lastStepAdvanced y finalDismissedAutoAt, son cookies a corto plazo (~10 segundos) que impiden que las guías aparezcan de nuevo después de haberlas descartado.","cookie-description-pendo-launcher-closed":"El agente utiliza esta cookie para identificar y registrar la información del visitante. Luego, la información se utiliza en el análisis y la entrega de guías de Pendo.","cookie-description-pendo-meta":"Se escribe y lee en el agente. Esta cookie almacena un hash de los metadatos actuales para que Pendo pueda ver cuándo cambiaron y se actualizaron.","cookie-description-pendo-receptive-ping-sent":"Igual que el anterior. Se renombró para que coincida con la nomenclatura de Pendo cuando se adquirió Feedback (anteriormente conocido como Receptive).","cookie-description-pendo-visitor-id":"El agente utiliza esta cookie para identificar y registrar la información del visitante, de modo que la información se utilice en el análisis y la entrega de guías de Pendo.","cookie-description-pin-unauth":"Esta cookie está asociada a Pinterest. Se usa para hacer un seguimiento del uso de los servicios.","cookie-description-response-trial":"Seek utiliza esta cookie","cookie-description-responsive-trial":"Seek utiliza esta cookie","cookie-description-s-cc":"Esta cookie está asociada al servicio de análisis proporcionado por el conjunto de productos SiteCatalyst de Adobe. Se usa para determinar si están habilitadas las cookies en el explorador.","cookie-description-s-ecid":"El nombre de esta cookie está asociado al identificador de Adobe Audience Manager (plataforma de administración de datos). Establece un identificador único para el visitante, lo que permite a los anunciantes externos mostrar a dicho visitante anuncios pertinentes. Las plataformas publicitarias externas proporcionan este servicio de emparejamiento y así permiten a los anunciantes publicar ofertas en tiempo real.","cookie-description-s-fid":"El nombre de esta cookie está asociado al servicio de análisis proporcionado por el conjunto de productos SiteCatalyst de Adobe. Se trata de una nueva cookie presentada en 2013 como identificador de visitante alternativo cuando se bloquea la cookie s_vi que normalmente se usa para este propósito. Contiene un identificador único generado de manera aleatoria.","cookie-description-s-invisit":"Esta cookie está asociada al servicio de análisis proporcionado por el conjunto de productos SiteCatalyst de Adobe. Se usa para contar las visitas que realiza un usuario al sitio web.","cookie-description-s-lastvisit":"El nombre de esta cookie está asociado a Adobe Analytics, que nos proporciona información estadística anónima. La información y las direcciones IP de otras cookies se procesan y usan en nuestro sitio web para contar las vistas de página, la cantidad de visitantes que tenemos, los exploradores que usan los visitantes (de modo que podamos centrar nuestros recursos adecuadamente y así maximizar la compatibilidad para la mayoría de los usuarios) y, en algunos casos, para conocer en qué país, región o ciudad se encuentran.","cookie-description-s-nr":"El nombre de esta cookie está asociado al servicio de análisis proporcionado por el conjunto de productos SiteCatalyst de Adobe. Se usa para almacenar la fecha en que se visitó un sitio web, así como si el visitante es nuevo o recurrente.","cookie-description-s-sq":"Esta cookie está asociada al servicio de análisis proporcionado por el conjunto de productos SiteCatalyst de Adobe. Se usa para almacenar información sobre el vínculo anterior en el que se hizo clic en el sitio web.","cookie-description-s-vnum":"Esta cookie está asociada al servicio de análisis proporcionado por el conjunto de productos SiteCatalyst de Adobe. Se usa para hacer un seguimiento del número de visitas realizadas por un único visitante.","cookie-description-scid":"Esta cookie está asociada a Snapchat. Establece un identificador único para el visitante, lo que permite a los anunciantes externos mostrar a dicho visitante anuncios pertinentes. Los portales publicitarios externos proporcionan este servicio de emparejamiento y así permiten a los anunciantes publicar ofertas en tiempo real.","cookie-description-sctr":"Esta cookie se utiliza para decidir si se llamará a una etiqueta de terceros en Snap Ads Pixel.","cookie-description-sj":"Seek utiliza esta cookie","cookie-description-third-party-pixel-tracking":"Permite al cliente medir la actividad de conversión de candidatos cuando inicia o termina una solicitud. URL de la política de privacidad: \u003clnk\u003e{{privacyPolicyUrl}}\u003c/lnk\u003e","cookie-description-updated-last-login":"Seek utiliza esta cookie","cookie-description-utag-main":"El nombre de esta cookie está asociado a la plataforma de datos Tealium. Se usa para análisis web.","cookie-description-visid-incap":"Esta cookie se usa para vincular determinadas sesiones (también denominadas visitas) a un visitante específico (es decir, una computadora específica). Esa cookie identifica a los clientes que ya visitaron el sitio web.","cookie-preferences-description":"Además, puede cambiar sus preferencias de cookies en cualquier momento. Para ello, haga clic en “Preferencias de cookies” en el pie de página de nuestro sitio web. Para obtener más información, consulte ","cookie-preferences-title":"Preferencias de cookies","cookie-prefs":"Preferencias de cookies","cookie-prefs-blocked-cookies-description":"Su explorador está configurado actualmente para bloquear las cookies. Nuestro sitio web no puede funcionar correctamente sin estas cookies esenciales. Entre otras cosas, le permiten mantener iniciada la sesión de su cuenta y postularse a puestos. \u003cbr/\u003e \u003cbr/\u003e Permita las cookies en el explorador web para utilizar este sitio de manera óptima.","cookie-prefs-description":"Usamos tecnología, como las cookies, para mejorar la funcionalidad del sitio, personalizar el contenido y analizar el tráfico del sitio web. Al hacer clic en \u0026quot;Aceptar\u0026quot;, también permite la publicidad y el análisis opcionales, así como el seguimiento de conversión del candidato. Puede obtener más información sobre el seguimiento en línea en nuestra \u003clnk\u003eDeclaración de cookies\u003c/lnk\u003e","cookie-settings":"Configuración de cookies","cookie-statement":"Centro de preferencias de cookies","cookie-statement-bullet-point1":"medir y realizar un seguimiento de sus actividades, como cuando navega por nuestro Sitio web;","cookie-statement-bullet-point2":"contar y reconocer los visitantes de nuestro Sitio web para ver qué páginas recibieron la mayor cantidad de visitas;","cookie-statement-bullet-point3":"personalizar su experiencia en nuestro Sitio web;","cookie-statement-bullet-point4":"permitirnos recordar sus preferencias de visualización y ayudar durante los registros e inicios de sesión;","cookie-statement-bullet-point5":"permitirnos hacer un seguimiento de su estado o progreso cuando solicita productos, servicios u otra información;","cookie-statement-bullet-point6":"recopilar análisis de desempeño sobre nuestro Sitio web;","cookie-statement-bullet-point7":"registrar los términos de búsqueda que escriba en nuestro sitio web, el vínculo en el que hizo clic para ir a la página web, su dirección IP o las cookies que estén configuradas en su explorador a través de los registros del servidor web.","cookie-statement-bullet-title":"Utilizamos cookies para los siguientes propósitos:","cookie-statement-description-first":"Dayforce utiliza cookies en el sitio web y la aplicación (denominados, en su conjunto, el “Sitio web”). Una cookie es un archivo que contiene un identificador (una cadena de letras y números) que un servidor web envía a un explorador web, donde se almacena dicho archivo. Luego, el identificador se envía de vuelta al servidor cada vez que el explorador solicita una página del servidor. Las cookies permiten a los Sitios web reconocer su dispositivo la próxima vez que los visite, hacer un seguimiento del historial de navegación, guardar sus preferencias e intereses personales, y mejorar y personalizar su experiencia de exploración.","cookie-statement-description-second":"Las cookies pueden ser cookies “persistentes” o cookies de “sesión”. Una cookie persistente se almacenará en el explorador web y seguirá siendo válida hasta su fecha de vencimiento definida, a menos que el usuario la elimine antes de la fecha de vencimiento. Por otro lado, una cookie de sesión vencerá al final de la sesión del usuario cuando se cierre el explorador web.","cookie-statement-hypelink":"Declaración de cookies de Dayforce","cookie-statement-link":"Puedes obtener más información sobre el seguimiento en línea en nuestra \u003clnk\u003eDeclaración de cookies\u003c/lnk\u003e.","cookie-statement-updated-on":"Actualizado el 31 de enero de 2024","cookies-blocked-error-on-save":"Su explorador está configurado actualmente para bloquear las cookies.","cookies-categories-list-title":"A continuación encontrará una lista de categorías de cookies que se identificaron en nuestro sitio web:","cookies-saved-successful":"Preferencias de cookies guardadas.","customer-privacy-policy-description":"Revise la política de privacidad de seguimiento de candidatos del cliente en \u003clnk\u003e{{privacyPolicyUrl}}\u003c/lnk\u003e.","functional-cookies":"Cookies funcionales","functional-cookies-description":"Estas cookies permiten que el Sitio web ofrezca una funcionalidad y personalización mejoradas. Pueden estar configuradas por nosotros o por proveedores externos cuyos servicios hayamos agregado a nuestras páginas. Si no permite estas cookies, es posible que la totalidad o parte de estos servicios no funcionen correctamente.","hide-cookie-details":"Ocultar detalles de las cookies","how-to-control-cookies":"Administrar cookies","how-to-control-cookies-description":"Si lo prefiere, puede configurar el explorador para que rechace las cookies o puede eliminar manualmente de la computadora todas las cookies o cookies individuales siguiendo las indicaciones del explorador. Sin embargo, si el explorador está configurado para rechazar las cookies o usted las elimina manualmente, es posible que tenga dificultades para acceder y usar algunas de las páginas y características que actualmente están en nuestro Sitio web o que publiquemos en dicho sitio en el futuro.","opt-out-for-sharing-description":"En virtud de algunas leyes de privacidad, podrá considerarse que la divulgación de la información del dispositivo y la actividad en Internet a terceros a través de cookies y otros rastreadores para publicidad dirigida sea un “uso compartido”. Para no aceptar ninguna de las cookies que puedan generar un “uso compartido” de información personal para publicidad dirigida, puede consultar cómo desactivar las cookies de segmentación.","opt-out-for-sharing-title":"No participar en el uso compartido de publicidad dirigida","performance-cookies":"Cookies de desempeño","performance-cookies-description":"Estas cookies nos permiten contar las visitas y los orígenes del tráfico para que podamos medir y mejorar el desempeño de nuestro Sitio web. Nos ayudan a conocer las páginas que tienen mayor o menor popularidad, así como ver el comportamiento de navegación de los visitantes en el Sitio web. La información recopilada a través de estas cookies se agrupa. Si no permite estas cookies, no sabremos cuándo visitó nuestro Sitio web y no podremos supervisar su desempeño.","show-cookie-details":"Mostrar detalles de las cookies","smartling":{"translate_paths":[{"key":"{*}","path":"*"}],"variants_enabled":"true"},"strictly-necessary-cookies":"Cookies estrictamente necesarias","strictly-necessary-cookies-description":"Estas cookies son necesarias para el funcionamiento del Sitio web y no se pueden desactivar en nuestros sistemas. Por lo general, solo se establecen en respuesta a acciones realizadas por usted que equivalen a una solicitud de servicios, como configurar las preferencias de privacidad, iniciar sesión o rellenar formularios. Puede configurar el explorador para que bloquee estas cookies o le avise sobre ellas, pero algunas partes del Sitio web no funcionarán.","third-party-pixel-tracking":"Seguimiento de píxeles de terceros"},"apply":{"add-educationhistory-record":"Agregar historial de estudios","add-entry":"Agregar entrada","add-reference-record":"Agregar re cy":{"privacyPolicyId":6,"name":"26D Privacy Policy","description":"Privacy Policy for 26 Defense","content":"\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003ePrivacy \u0026amp; Cookie Policy\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eLast Updated: 09/09/2026\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 12.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eTwenty-Six Defense, Inc. and its subsidiaries and affiliates (\u0026ldquo;Twenty-Six Defense, Inc.,\u0026rdquo; \u0026ldquo;we\u0026rdquo;, \u0026ldquo;us\u0026rdquo;, or \u0026ldquo;our\u0026rdquo;) take your privacy seriously, so we want you to know how we collect, use, share, and protect your personal information. This Privacy Policy applies to personal information that we collect about you on this website (the \u0026ldquo;Website\u0026rdquo;) and to personal information that you submit to us or that we collect via online fillable forms, email, or SMS campaigns, our mobile applications, software, or any other Twenty-Six Defense, Inc. product or service that incorporates this Privacy Policy by reference (all of which, including the Website, are collectively referred to in this policy as the \u0026ldquo;Site\u0026rdquo;). You should not access the Site or use our services until you have carefully read this Privacy Policy and agree to the terms and conditions described in it.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eFor all non-U.S. users of, or visitors to, the Site, any information you provide, including any personal information, will be transferred to and processed by a computer server located within the United States. Your personal information will be handled in accordance with this Privacy Policy and U.S. law, which may be less stringent than the law where you reside.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eInformation We Collect and Use\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWe collect information that you voluntarily share with us or permit us to receive and use that information to help us administer our business or provide products, services, or other opportunities to you. We also collect information through technology to enhance our ability to serve you. Among other things, we use the information we learn about you to help us personalize and improve the experience you have on our website, to respond to your requests and to communicate with you. The types of information we collect, retain, and use depending on how you interact with us may include the following: first name, last name, email address, phone number, description of how we can help you, IP address, browser type, operating system, and device identifiers.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eSite Use Information\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eIn general, you can visit the Site without telling us who you are or revealing any information about yourself. Our web servers collect the domain names, not the email addresses, of visitors. This information is aggregated to measure the number of visits, average time spent on the Site, pages viewed, etc. Twenty-Six Defense\u0026reg; utilizes this information to measure the use of our Site and to improve the content we offer. We may share with third parties experiential information or other data which does not personally identify users of our site.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eRegistration Information\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWhen you register on our site to receive news from Twenty-Six Defense\u0026reg;, we collect profile information from you (\u0026ldquo;Personally Identifiable Information\u0026rdquo;). We require that you provide your first and last name, email address, and other information as requested in the applicable registration pages. At your option, you may voluntarily provide additional information, including address, phone/fax, and, in the case of seeking employment at Twenty-Six Defense\u0026reg;, your employment history. Although you may choose not to provide the optional information to us, it may result in some features not being available to you.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eBy providing this Personally Identifiable Information to us, you explicitly agree to our collection and usage of such information as described in this Privacy Policy. We use your Personally Identifiable Information to respond to your inquiries, process an order, contact you regarding account status or customer service, ask you for feedback on our service, let you know about products or services which may be of interest to you, or allow you to access specific account information, or in the case of seeking employment at Twenty-Six Defense\u0026reg;, match you with appropriate job opportunities. When you register, you consent to allow us to contact you for those purposes.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eCookies\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWe utilize cookies, tags, and related tracking technologies (collectively \u0026ldquo;Cookies\u0026rdquo;) to collect certain aggregate and non-personal information when you visit this site. Aggregate and non-personal information does not relate to a single identifiable visitor; it tells us such things as how many users visited the Site and which pages were accessed. We collect this information through Cookie technology. We use the following categories of cookies: (1) strictly necessary cookies, which are required to operate the Site, maintain security, and enable core features; (2) performance and analytics cookies, which help us understand how visitors use the Site and improve its content; and (3) functionality cookies, which remember your preferences and support enhanced features.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eLike many websites, we use cookies and similar technologies to help us remember your preferences and identify which portions of the Site are most relevant to visitors. If we use a third-party analytics tool, such as Google Analytics, that provider may use cookies or similar tracking technologies to collect information about Site usage. Third-party cookies and analytics practices are subject to the applicable provider\u0026rsquo;s own privacy policy. You can manage, accept, or disable cookies through your web browser settings. Disabling cookies may affect the availability or functionality of certain Site features. We do not use cookies to examine your browsing behavior before or after you leave the Site, and we do not use cookies for targeted advertising.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eDo Not Track Signals\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eThe Site does not currently respond to \"Do Not Track\" browser signals. There is no industry-wide standard for recognizing or responding to these signals, so the Site does not take action based on them at this time.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eEmail Communications\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWe use your email address to contact you to respond to your inquiries or to provide information on products or services to you. To help us determine whether you have received an email from us, and to help us make emails more useful and interesting, we may receive a confirmation that you have opened an email from us.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eChild Privacy\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eThis Site is not intended for use by persons under 18, consistent with the age restriction in our Terms of Use. However, for purposes of children\u0026rsquo;s privacy and data collection, Twenty-Six Defense\u0026reg; does not knowingly solicit, collect, or receive personal information from children under the age of 18 on the Site. If we become aware that we have inadvertently received personal information from a visitor under the age of 18 on the Site, we will delete the information from our records. If you are a parent or guardian and believe that your child under 18 has provided us with personal information, please contact us using the information below so that we can take appropriate action.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eSome links on 26defense.com may take website visitors to sites that are directed to children. These websites have their own privacy notices that address children\u0026rsquo;s privacy. We encourage you to read these privacy notices if you visit any linked sites directed to children.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eRestrictions on Disclosing Information\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWe do not sell, rent, or trade your Personally Identifiable Information to others. We do not reveal Personally Identifiable Information about you to unaffiliated third parties, unless: (1) you request or authorize it; (2) the information is provided to help complete a transaction for you; (3) the information is provided to comply with the law, applicable regulations, court orders or subpoenas, to enforce our Terms of Use or other agreements, or to protect our rights, property or safety or the rights, property or safety of our users or others (e.g., to a consumer reporting agency for fraud protection;) (4) the disclosure is done as part of a purchase, transfer or sale of services or assets (e.g., in the event that substantially all of our assets are acquired by another party, customer information may be one of the transferred assets;) or (5) the information is provided to our agents, outside vendors or service providers to perform functions on our behalf (e.g., analyzing data, providing marketing assistance, providing customer service, etc.) We may also gather aggregated data about you and disclose such aggregated (but not personally identifiable) information to third parties for promotional or other purposes.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eYour Privacy Rights\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eDepending on the nature of your relationship with us, your state of residence, and subject to applicable exceptions, you may have the following rights with respect to your personal information:\u003c/span\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: lower-alpha; margin-bottom: 0in; margin-top: 0px;\"\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eRight to know/access. You may request to know what personal information we collect, use, disclose, or otherwise process and may request access to that information.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eRight to delete. You may request deletion of personal information that we collected from or maintain about you, subject to applicable exceptions.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eRight to correct. You may request correction of inaccurate personal information that we maintain about you.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eRight to opt out of sale or sharing. You may opt out of the sale or sharing of your personal information as those terms are defined by applicable law. Twenty-Six Defense does not sell personal information.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eRight to non-discrimination. We will not discriminate against you for exercising your privacy rights.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eHow to submit a request. You may submit a verifiable consumer request by email to legal@26defense.com or by mail to the address provided in the \u0026ldquo;Contact Us\u0026rdquo; section below. Please provide sufficient information for us to verify your identity and understand your request; we may request additional information as permitted by law.\u003c/span\u003e\u003c/li\u003e\n\u003cli style=\"margin: 0in 0in 0in 0px; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif; color: #000000;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eApplicable jurisdictions. These rights apply to California residents under the California Consumer Privacy Act, as amended by the California Privacy Rights Act (collectively, the \u0026ldquo;CCPA/CPRA\u0026rdquo;), and to residents of other states with applicable privacy laws, including Colorado, Connecticut, Virginia, Texas, and other states with applicable privacy laws, subject to the scope, exceptions, and limitations of those laws.\u003c/span\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eSecurity Procedures\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWe maintain numerous security standards and procedures to help prevent unauthorized access to confidential information about you. Our Site uses a combination of encryption technology and authentication to protect your Personally Identifiable Information. As long as the web browser you are using supports Transport Layer Security (TLS) your information will be submitted to us with a high level of security. We update and test our security technology on an ongoing basis. We have procedures limiting employee access to Personally Identifiable Information to those employees who have a business reason to know such information about you. In the event of a data breach affecting your personal information, we will notify you and any applicable regulatory authorities as required by applicable law.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eIt is also important for you to help protect against unauthorized access by signing off of our Site each time you finish using the Site.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eData Retention\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eWe retain your personal information only for as long as reasonably necessary to fulfill the purposes for which it was collected, comply with our legal obligations, resolve disputes, and enforce our agreements. When personal information is no longer needed, we will securely delete or anonymize it.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eInapplicability of Privacy Policies\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eTwenty-Six Defense\u0026reg;'s Site may contain links to other sites such as parent corporation, affiliates, or other third party distributors and sales representatives. This Privacy Policy only addresses Twenty-Six Defense\u0026reg;'s use and disclosure of your Personally Identifiable Information collected on this site. While we try to link only to sites that share our standards and respect for privacy, we are not responsible for the privacy practices of any third parties or the content of linked sites, and we encourage you to read the applicable privacy policies and terms and conditions of such parties or websites.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eTerms of Use, Notices and Changes to our Privacy Policy\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eIn the event of any conflict between the terms of this Privacy Policy and the Terms of Use, then the Terms of Use shall control.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003eAs our business changes, this Privacy Policy and the Terms of Use are expected to change from time to time, and we reserve the right to change the Privacy Policy and Terms of Use at any time. The use of your information is subject to the Privacy Policy and Terms of Use in effect at the time of use. The provisions contained herein supersede all previous notices or statements regarding our privacy practices with respect to this Site. We may email periodic reminders of our notices and terms and conditions and post any changes to the Privacy Policy and the Terms of Use on our Site. We encourage you to check our Site frequently to see the current Privacy Policy and Terms of Use in effect and any changes that may have been made to them.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 16.0pt; line-height: 115%; font-family: Arial, sans-serif;\"\u003eContact Us\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"margin: 0in; line-height: 115%; font-size: 11pt; font-family: 'Century Gothic', sans-serif;\"\u003e\u003cspan style=\"font-size: 12pt; line-height: 115%; font-family: Arial, sans-serif; color: #000000;\"\u003e\u003ca rel=\"noopener\" href=\"mailto:legal@26defense.com\" target=\"_blank\"\u003elegal@26defense.com\u003c/a\u003e\u003c/span\u003e\u003c/p\u003e","isDefault":true,"lastPublishedTimestampUTC":"2026-09-14T10:14:34.45+00:00"},"smallLogo":{"imageId":15,"imageName":"26D-Logo-100x40","description":"26D-Logo-100x40","url":"https://us261.dayforcehcm.com/CandidatePortal/en-US/esa/Go?item=be404868-e53e-4f83-885d-beb06ae58fa7"},"largeLogo":{"imageId":16,"imageName":"26D-Logo-200x80","description":"26D-Logo-200x80","url":"https://us261.dayforcehcm.com/CandidatePortal/en-US/esa/Go?item=47399cfe-08c8-45fd-8805-f3a2fb3c0c27"},"jobPostingBanner":{"imageId":17,"imageName":"26D-Job Posting Banner-1000x200","description":"26D-Logo-1000x200","url":"https://us261.dayforcehcm.com/CandidatePortal/en-US/esa/Go?item=e137fe97-ce78-48a1-b074-f693b82872fb"},"jobBoardTheme":{"themeId":6,"primaryColour":"#c3512c","secondaryColour":"#353434","accentColour":"#353434","lightColour":"#f3f2f2","successColour":"#00c63c","attentionColour":"#ffd652","alertColour":"#ff5500","errorColour":"#eb0000","grayScaleColour":"#393839","grayScale100Colour":"#4d4d4f","grayScale200Colour":"#747679","grayScale300Colour":"#bcbec0","grayScale400Colour":"#e2e3e4","grayScale500Colour":"#f1f1f2","grayScale600Colour":"#ffffff"},"enableSavedJobs":true,"enableSavedSearches":true,"enableRecommendedJobs":false,"enableAppliedJobs":true,"enableDraftApplications":false,"enablePrivacyPolicy":true,"enableApplyWithPhoneNumber":false,"enableAppl
